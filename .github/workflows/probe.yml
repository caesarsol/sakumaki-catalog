name: probe

# Sonda: parte a ogni push su questo ramo (vedi CLAUDE.md, "Interrogare l'API vera").
on:
  push:
    branches: [claude/probe-tmp]

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      API_BASE: ${{ secrets.API_BASE }}
      NORD_USER: ${{ secrets.NORD_USER }}
      NORD_PASS: ${{ secrets.NORD_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: |
          bun install --frozen-lockfile
      - run: |
          bun run src/probe.ts GYQ4MKDZ6

name: probe

# Sonda: parte a ogni push su questo ramo (vedi CLAUDE.md, "Interrogare l'API vera").
on:
  push:
    branches: [claude/probe-tmp]

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - run: |
          gh run watch 39476853377 -R "$R" --interval 60 > /dev/null || true
          echo "voti: $(gh run view 39476853377 -R "$R" --json conclusion --jq .conclusion)"
          gh workflow run catalog.yml --ref main -R "$R"
          echo "catalogo lanciato"

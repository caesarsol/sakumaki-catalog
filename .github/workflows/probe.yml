name: probe

# Sonda: parte a ogni push su questo ramo (vedi CLAUDE.md, "Interrogare l'API vera").
on:
  push:
    branches: [claude/probe-tmp]

permissions:
  contents: read
  actions: write

jobs:
  mal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: |
          bun install --frozen-lockfile
          bun run src/probe.ts
  dates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_BASE: ${{ secrets.API_BASE }}
      NORD_USER: ${{ secrets.NORD_USER }}
      NORD_PASS: ${{ secrets.NORD_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: |
          bun install --frozen-lockfile
          bun run src/probe-dates.ts

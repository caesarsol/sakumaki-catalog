name: probe

# Temporaneo, su un ramo da cancellare.
on:
  push:
    branches: [claude/probe-tmp]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - run: |
          gh workflow run watchlist.yml --ref main -R "$R"
          sleep 15
          id=$(gh run list -R "$R" --workflow watchlist.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$id" -R "$R" --exit-status > /dev/null
          gh run download "$id" -R "$R" --name watchlist --dir data
      - run: |
          jq -c 'to_entries[] | select(.key | test("GXJHM3N2E|GYMGD89VY|GRX0MGN76|G65VXM1P6|GP5HJ845X|GRWE17JQR|GYNQJ8GXY|G679D84KY|GRQ4Z4XQY|GXJHM3P19")) | {id: .key, s: .value.season, done: .value.ep_done, tot: .value.ep_total, started: .value.ep_started}' data/watchlist-progress.json
          jq -r '[.[]] | "con ep_total: \([.[]|select(.ep_total)]|length) su \(length); iniziate: \([.[]|select(.ep_started)]|length)"' data/watchlist-progress.json

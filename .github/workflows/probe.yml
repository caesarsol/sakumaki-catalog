name: probe

# Temporaneo, su un ramo da cancellare: sonda dell'API per watchlist, posizione delle puntate e voti esterni.
on:
  push:
    branches: [claude/probe-tmp]

permissions:
  contents: read
  actions: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUTH_COOKIE: ${{ secrets.AUTH_COOKIE }}
      API_BASE: ${{ secrets.API_BASE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: gh workflow run catalog.yml --ref main
        continue-on-error: true
      - run: gh run download "$(gh run list --workflow catalog.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')" --name catalog --dir data
      - run: bun run src/probe.ts

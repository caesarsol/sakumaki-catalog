name: probe

# Sonda: parte a ogni push su questo ramo (vedi CLAUDE.md, "Interrogare l'API vera").
on:
  push:
    branches: [claude/probe-tmp]

permissions:
  contents: read
  actions: write

jobs:
  myrating:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUTH_COOKIE: ${{ secrets.AUTH_COOKIE }}
      API_BASE: ${{ secrets.API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: |
          bun install --frozen-lockfile
          bun run src/probe-myrating.ts

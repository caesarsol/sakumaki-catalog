name: probe

# Temporaneo, su un ramo da cancellare: lancia i workflow su main, che via MCP non si possono lanciare.
on:
  push:
    branches: [claude/probe-tmp]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run watchlist.yml --ref main -R ${{ github.repository }}
      - run: gh workflow run ratings.yml --ref main -R ${{ github.repository }}

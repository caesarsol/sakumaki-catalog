name: update

on:
  schedule:
    - cron: "0 5 * * *" # 07:00 Europe/Rome in estate, 06:00 in inverno
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      AUTH_COOKIE: ${{ secrets.AUTH_COOKIE }}
      API_BASE: ${{ secrets.API_BASE }} # gli host sono secret, non variabili: nei log pubblici vengono mascherati
      SITE_BASE: ${{ secrets.SITE_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run watchlist
      - run: bun run watchlist-votes
      - run: bun run catalog
      - run: bun run table
      - run: mkdir -p site && cp data/table.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: catalog

on:
  schedule:
    - cron: "0 2 * * 6" # sabato, stessa ora di watchlist.yml: 04:00 Europe/Rome in estate, 03:00 in inverno
  workflow_dispatch:

permissions:
  contents: write # solo per lo storico nel ramo history
  actions: write # per scaricare l'artifact precedente e lanciare watchlist.yml a fine run

jobs:
  catalog:
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ secrets.API_BASE }} # gli host sono secret, non variabili: nei log pubblici vengono mascherati
      NORD_USER: ${{ secrets.NORD_USER }} # service credentials NordVPN (Nord Account > Manual setup), per il proxy per paese
      NORD_PASS: ${{ secrets.NORD_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: gh run download "$(gh run list --workflow catalog.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')" --name catalog --dir data # elenchi della settimana scorsa: un paese che fallisce oggi tiene il suo
        continue-on-error: true # al primo run non c'è nessun artifact
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bun run catalog # 5 paesi alla volta, login a distanza casuale; per ogni paese le serie e le stagioni di ognuna
        continue-on-error: true # un paese fallito non blocca gli altri e tiene il catalog-<ISO2>.ndjson della settimana scorsa
      - run: bun run merge
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: data/catalog*.ndjson # merge più i file per paese, che la settimana prossima fanno da riserva
          retention-days: 90
      - run: bun run src/history.ts data/catalog-??.ndjson data/catalog-seasons-*.ndjson # storico nel ramo history: git salva solo cosa cambia, e non scade
        continue-on-error: true # lo storico non deve fermare watchlist e voti
      - run: gh workflow run watchlist.yml -f full_ratings=true # ricostruisce la pagina con il catalogo nuovo, e una volta a settimana rilegge tutti i voti personali
        env:
          GH_TOKEN: ${{ github.token }}
      - run: gh workflow run ratings.yml # voti AniList e MAL per le serie del catalogo nuovo
        env:
          GH_TOKEN: ${{ github.token }}

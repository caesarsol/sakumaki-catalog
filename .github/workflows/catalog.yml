name: catalog

on:
  schedule:
    - cron: "0 3 * * 1" # lunedì, 05:00 Europe/Rome in estate, 04:00 in inverno
  workflow_dispatch:

permissions:
  contents: read
  actions: write # per lanciare update.yml a fine run

jobs:
  catalog:
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ secrets.API_BASE }} # gli host sono secret, non variabili: nei log pubblici vengono mascherati
      NORD_USER: ${{ secrets.NORD_USER }} # service credentials NordVPN (Nord Account > Manual setup), per il proxy per paese
      NORD_PASS: ${{ secrets.NORD_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run catalog # token anonimo, 5 minuti fra un paese e l'altro: circa un'ora
        continue-on-error: true # un paese fallito non blocca gli altri: merge usa i cataloghi scaricati
      - run: bun run merge
      - uses: actions/upload-artifact@v4
        with:
          name: catalog
          path: data/catalog.ndjson
          retention-days: 90
      - run: gh workflow run update.yml # ricostruisce la pagina con il catalogo nuovo
        env:
          GH_TOKEN: ${{ github.token }}

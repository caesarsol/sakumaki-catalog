name: watchlist

# Solo dati: scarica la watchlist dell'account e la lascia come artifact, poi chiede a deploy.yml
# di ripubblicare la pagina. La tabella non si costruisce qui.
on:
  schedule:
    - cron: "0 5 * * *" # 07:00 Europe/Rome in estate, 06:00 in inverno
  workflow_dispatch:

permissions:
  contents: read
  actions: write # per lanciare deploy.yml a fine run

jobs:
  watchlist:
    runs-on: ubuntu-latest
    env:
      AUTH_COOKIE: ${{ secrets.AUTH_COOKIE }}
      API_BASE: ${{ secrets.API_BASE }} # gli host sono secret, non variabili: nei log pubblici vengono mascherati
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run watchlist
      - run: bun run watchlist-progress
      - run: bun run watchlist-votes
      - uses: actions/upload-artifact@v4
        with:
          name: watchlist
          path: data/watchlist-progress.json # solo l'avanzamento che la pagina mostra: gli artifact di un repo pubblico sono pubblici, e watchlist.json contiene anche id e titoli delle puntate
          retention-days: 30
      - run: gh workflow run deploy.yml # ripubblica la pagina con la watchlist di stamattina
        env:
          GH_TOKEN: ${{ github.token }}
